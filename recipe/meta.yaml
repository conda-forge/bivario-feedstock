{% set name = "bivario" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/bivario-{{ version }}.tar.gz
  sha256: 210ff2a289696f9f0537c6b3b5ef84afba0bc11f931b5a834a846da1865317ae

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - uv-build >=0.9.1,<0.10.0
    - pip
  run:
    - python >={{ python_min }}
    - colour-science >=0.4.0
    - mapclassify >=2
    - matplotlib-base >=3.3
    - narwhals >=1.9.4
    - numpy >=1.19

test:
  imports:
    - bivario
  commands:
    - pip check
    - python "${RECIPE_DIR}/smoke_test.py"  # [unix]
    - python "%RECIPE_DIR%\smoke_test.py"  # [win]
  requires:
    - pip
    - python {{ python_min }}
    - geopandas >=1.0.1

about:
  home: https://github.com/RaczeQ/bivario
  summary: Python library for plotting bivariate choropleth maps
  license: MIT
  license_file: LICENSE.txt
  dev_url: https://github.com/RaczeQ/bivario

extra:
  recipe-maintainers:
    - RaczeQ
